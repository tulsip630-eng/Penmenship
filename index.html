<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penmenship Practice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>Penmenship Practice Studio</h1>
        <p>Practice print and cursive handwriting with guided tracing and a motivational boost.</p>
      </header>

      <section class="panel controls">
        <div class="control-group">
          <label for="mode">Practice mode</label>
          <select id="mode">
            <option value="print">Print</option>
            <option value="cursive">Cursive</option>
          </select>
        </div>

        <div class="control-group">
          <label for="practiceText">Trace text</label>
          <input id="practiceText" type="text" maxlength="60" value="Practice makes progress" />
        </div>

        <div class="control-group actions">
          <button id="loadLetters">Load alphabet drill</button>
          <button id="loadSentence">Load sentence drill</button>
          <button id="clearCanvas" class="secondary">Clear tracing</button>
        </div>
      </section>

      <section class="panel workspace">
        <canvas id="traceCanvas" width="960" height="360" aria-label="Tracing area"></canvas>
        <p class="hint">Use mouse, touch, or stylus to trace over the guide text.</p>
      </section>

      <section class="panel motivation">
        <div class="motivation-top">
          <h2>Motivation Meter</h2>
          <span id="progressLabel">0 / 5 goals</span>
        </div>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progressFill"></div>
        </div>
        <div class="goal-actions">
          <button id="markGoal">Mark practice goal complete</button>
          <button id="resetGoals" class="secondary">Reset goals</button>
        </div>
      </section>

      <section class="panel quotes">
        <h2>Fun quote of the session</h2>
        <blockquote id="quoteText">"Your handwriting is your brain's dance on paper."</blockquote>
        <button id="newQuote" class="secondary">New quote</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
